name: Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest' # ubuntu-latest
  schedule:
    - cron: '0 0 */16 * *'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - name: Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android \
                      /usr/local/.ghcup \
                      /usr/local/share/boost \
                      /usr/share/dotnet \
                      /usr/lib/dotnet \
                      /usr/lib/jvm \
                      /usr/lib/google-cloud-sdk \
                      /usr/share/swift \
                      /opt/hostedtoolcache \
                      /var/lib/docker \
                      /usr/share/miniconda 2>/dev/null || true
          sudo docker image prune -a -f 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h /
      
      - name: Update 
        run: |
          if [ ! -d "vanadium" ]; then
            git clone https://github.com/GrapheneOS/Vanadium.git vanadium
          fi
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          export VERSION=$(grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          git add vanadium
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -am "update"
            git push
          fi

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.VERSION }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.VERSION }}-
            ccache-${{ runner.os }}-

      - name: Set ENV
        run: | 
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV
          echo "CCACHE_DIR=${HOME}/.cache/ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
          echo "CCACHE_NOHASHDIR=1" >> $GITHUB_ENV
          echo "CCACHE_CPP2=1" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=8G" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime,time_macros,file_macro,system_headers" >> $GITHUB_ENV
    
      - name: Build
        env:
            DEBIAN_FRONTEND: noninteractive
            LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
            STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          ./build.sh

      - name: Set
        run: |
          export VERSION=$(find chromium/src/out/release -name '*arm64-v8a.apk' | sed 's/.*\///;s/\-arm64-v8a.apk$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mv $(find chromium/src/out/release -name '*arm64-v8a.aab') $VERSION-${{ env.unix_time }}-arm64-v8a.aab
          mv $(find chromium/src/out/release -name '*arm64-v8a.apk') $VERSION-${{ env.unix_time }}-arm64-v8a.apk

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk

      - name: Save CCache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.VERSION }}-${{ github.run_id }}
